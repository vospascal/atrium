# Reference: i must rest here a moment
# spiritual brother, 15:00 to 17:00 of https://www.youtube.com/watch?v=IXsWr2CK4SI
#
# E minor (or G major) notes in the mids (E, D, A, G, B, F#) over a B-flat
# and F in the bass, most of it a broad soft texture rather than clear notes
# (only a third of the power is in distinct partials). The whole swells
# together on a cycle of about 39 s. As wide as a recording gets (the ears
# almost unrelated); no events.
#
# The recording's two channels from where stereo speakers stand, 30 degrees
# left and right of the listener, 2 m away, in the dry space, so it sounds as
# the record does on speakers. Each ear hears both channels, as with real
# speakers, so on headphones it is narrower than the record played straight
# into the ears (width 0.15-0.25 lower; 0.34 against 0.57 for "it wasn't
# always empty"). Someone else's recording: not in git. Fetch it first:
#   sh scripts/clip.sh https://www.youtube.com/watch?v=IXsWr2CK4SI 15:00 17:00
# Taken apart in docs/ambient-recipes.md.
#   cargo run --release -- scenes/reference-i-must-rest-here-a-moment.yaml --headphones

title: "reference: i must rest here a moment"

kind: listening

atrium: rooms/atrium_6x4.yaml

listener:
  position: [0.0, 0.0, 1.2]
  yaw_degrees: 90.0

master_gain: 1.0

distance_model:
  model: inverse
  ref_distance: 1.0
  max_distance: 40.0
  rolloff: 1.0

speakers:
  layout: '5.1'
  render_mode: vbap
  positions:
    fl: [-3.0, 2.0, 0.0]
    fr: [3.0, 2.0, 0.0]
    c: [0.0, 2.0, 0.0]
    rl: [-3.0, -2.0, 0.0]
    rr: [3.0, -2.0, 0.0]
  dbap_rolloff_db: 6.0

normalization:
  target_rms: 0.1
  spl_reference: 94.0
  spl_threshold: 0.0

sounds:
  left:
    name: "i must rest here a moment · left"
    group: References
    sound:
      preset: sources/references/i-must-rest-here-a-moment-left.yaml
      level: 58.0
    place: [-1.0, 1.732, 1.2]
  right:
    name: "i must rest here a moment · right"
    group: References
    sound:
      preset: sources/references/i-must-rest-here-a-moment-right.yaml
      level: 58.0
    place: [1.0, 1.732, 1.2]

hrtf: assets/hrtf/default.sofa

weather:
  story: held
  wind: 0.0
  rain: 0.0
  storm: 0.0
  daylight: 1.0

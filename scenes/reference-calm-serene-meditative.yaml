# Reference: Calm | Serene Meditative Music for Late Nights
# Astral Ambience, 31:00 to 33:00 of https://www.youtube.com/watch?v=caAVbyTCptw
#
# C major or A minor: a pad of D2, A2, C3, D3, E3, G3, A3 and C4 in two
# groups that take turns about every 14 s (a 27 s cycle). Several notes are
# doubled by two voices 27 cents either side, a quarter tone apart: a wide
# chorus, whose voices about 1 Hz apart beat gently at 1 Hz. Each note
# swells 20 to 30 dB as its group comes in; no events.
#
# The recording's two channels from where stereo speakers stand, 30 degrees
# left and right of the listener, 2 m away, in the dry space, so it sounds as
# the record does on speakers. Each ear hears both channels, as with real
# speakers, so on headphones it is narrower than the record played straight
# into the ears (width 0.15-0.25 lower; 0.34 against 0.57 for "it wasn't
# always empty"). Someone else's recording: not in git. Fetch it first:
#   sh scripts/clip.sh https://www.youtube.com/watch?v=caAVbyTCptw 31:00 33:00
# Taken apart in docs/ambient-recipes.md.
#   cargo run --release -- scenes/reference-calm-serene-meditative.yaml --headphones

title: "reference: Calm | Serene Meditative Music for Late Nights"

kind: listening

atrium: rooms/atrium_6x4.yaml

listener:
  position: [0.0, 0.0, 1.2]
  yaw_degrees: 90.0

master_gain: 1.0

distance_model:
  model: inverse
  ref_distance: 1.0
  max_distance: 40.0
  rolloff: 1.0

speakers:
  layout: '5.1'
  render_mode: vbap
  positions:
    fl: [-3.0, 2.0, 0.0]
    fr: [3.0, 2.0, 0.0]
    c: [0.0, 2.0, 0.0]
    rl: [-3.0, -2.0, 0.0]
    rr: [3.0, -2.0, 0.0]
  dbap_rolloff_db: 6.0

normalization:
  target_rms: 0.1
  spl_reference: 94.0
  spl_threshold: 0.0

sounds:
  left:
    name: "Calm | Serene Meditative Music for Late Nights · left"
    group: References
    sound:
      preset: sources/references/calm-serene-meditative-left.yaml
      level: 58.0
    place: [-1.0, 1.732, 1.2]
  right:
    name: "Calm | Serene Meditative Music for Late Nights · right"
    group: References
    sound:
      preset: sources/references/calm-serene-meditative-right.yaml
      level: 58.0
    place: [1.0, 1.732, 1.2]

hrtf: assets/hrtf/default.sofa

weather:
  story: held
  wind: 0.0
  rain: 0.0
  storm: 0.0
  daylight: 1.0

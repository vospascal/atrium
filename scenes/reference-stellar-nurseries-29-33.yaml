# Reference: Dark Space Music for Stellar Nurseries and Molecular Clouds (29:00-33:00)
# Cryo Chamber, 29:00 to 33:00 of https://www.youtube.com/watch?v=Yk2bpo5paPw
#
# A busier stretch of the same piece: a low tone near 29 and 59 Hz that
# throbs every 8 s, its bass notes wandering 14 to 30 cents; a three-note
# chord (about C#4, F4 and C#5, tuned some 40 cents off concert pitch)
# returning every 42 s for about 17 s; the level moving 12 dB. Several notes
# detuned between the ears by 0.4 to 1 Hz, which turns the image slowly.
#
# The recording's two channels from where stereo speakers stand, 30 degrees
# left and right of the listener, 2 m away, in the dry space, so it sounds as
# the record does on speakers. Each ear hears both channels, as with real
# speakers, so on headphones it is narrower than the record played straight
# into the ears (width 0.15-0.25 lower; 0.34 against 0.57 for "it wasn't
# always empty"). Someone else's recording: not in git. Fetch it first:
#   sh scripts/clip.sh https://www.youtube.com/watch?v=Yk2bpo5paPw 29:00 33:00
# Taken apart in docs/ambient-recipes.md.
#   cargo run --release -- scenes/reference-stellar-nurseries-29-33.yaml --headphones

title: "reference: Dark Space Music for Stellar Nurseries and Molecular Clouds (29:00-33:00)"

kind: listening

atrium: rooms/atrium_6x4.yaml

listener:
  position: [0.0, 0.0, 1.2]
  yaw_degrees: 90.0

master_gain: 1.0

distance_model:
  model: inverse
  ref_distance: 1.0
  max_distance: 40.0
  rolloff: 1.0

speakers:
  layout: '5.1'
  render_mode: vbap
  positions:
    fl: [-3.0, 2.0, 0.0]
    fr: [3.0, 2.0, 0.0]
    c: [0.0, 2.0, 0.0]
    rl: [-3.0, -2.0, 0.0]
    rr: [3.0, -2.0, 0.0]
  dbap_rolloff_db: 6.0

normalization:
  target_rms: 0.1
  spl_reference: 94.0
  spl_threshold: 0.0

sounds:
  left:
    name: "Dark Space Music for Stellar Nurseries and Molecular Clouds (29:00-33:00) · left"
    group: References
    sound:
      preset: sources/references/stellar-nurseries-29-33-left.yaml
      level: 58.0
    place: [-1.0, 1.732, 1.2]
  right:
    name: "Dark Space Music for Stellar Nurseries and Molecular Clouds (29:00-33:00) · right"
    group: References
    sound:
      preset: sources/references/stellar-nurseries-29-33-right.yaml
      level: 58.0
    place: [1.0, 1.732, 1.2]

hrtf: assets/hrtf/default.sofa

weather:
  story: held
  wind: 0.0
  rain: 0.0
  storm: 0.0
  daylight: 1.0

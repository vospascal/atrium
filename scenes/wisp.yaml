# Scene: Wisp (5.1 speakers)
# One wisp flying around and through the room in an open meadow. It hovers,
# then darts to a new spot within 6 m of the room centre, so it passes between
# the speakers, crosses the room and goes overhead.
#   cargo run --release -- scenes/wisp.yaml
#
# Listen for: the whirr speeding up and brightening as it darts, slowing as
# it hovers, and the pitch bending as it passes.

environment: environments/meadow.yaml
atrium: rooms/atrium_6x4.yaml

listener:
  position: [0.0, 0.0, 1.2]   # centre of the room, ears at 1.2 m
  yaw_degrees: 90.0           # facing +Y (the front speakers)

# +12 dB: at 1.0 this scene peaks at 0.02 of full scale (measured), which
# needs the amplifier turned far up. At 4.0 it peaks near 0.08.
master_gain: 4.0

distance_model:
  model: inverse
  ref_distance: 1.0
  max_distance: 40.0
  rolloff: 1.0

speakers:
  layout: "5.1"
  render_mode: world_locked    # speakers as microphones: arrival delays + Doppler
  positions:
    fl: [-3.0, 2.0, 0.0]
    fr: [3.0, 2.0, 0.0]
    c:  [0.0, 2.0, 0.0]
    rl: [-3.0, -2.0, 0.0]
    rr: [3.0, -2.0, 0.0]

normalization:
  target_rms: 0.1
  spl_reference: 94.0
  spl_threshold: 0

sounds:
  wisp:
    name: Wisp
    color: "#f2c94c"
    group: Creatures
    sound: { preset: sources/wisp.yaml }
    place: [0.0, 0.0, 0.0]   # centre of its territory (the room centre)

atmosphere: atmospheres/default.yaml

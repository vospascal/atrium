# Reference: it wasn't always empty
# spiritual brother Sci-Fi, 20:00 to 23:00 of https://www.youtube.com/watch?v=gP3BBaoU0_E
#
# E major over a pure E2 pedal (82.41 Hz) that holds almost dead still.
# Above it a pad on the scale's notes from E3 to B4, each note rising and
# falling on its own over tens of seconds; soft single bell notes (E5, F#5,
# B5, C#6) every 2 to 17 s, each fading over 2 to 6 s; and faint air at 2 to
# 12 kHz swelling on a regular 22 s cycle.
#
# The recording's two channels from where stereo speakers stand, 30 degrees
# left and right of the listener, 2 m away, in the dry space, so it sounds as
# the record does on speakers. Each ear hears both channels, as with real
# speakers, so on headphones it is narrower than the record played straight
# into the ears (width 0.15-0.25 lower; 0.34 against 0.57 for "it wasn't
# always empty"). Someone else's recording: not in git. Fetch it first:
#   sh scripts/clip.sh https://www.youtube.com/watch?v=gP3BBaoU0_E 20:00 23:00
# Taken apart in docs/ambient-recipes.md.
#   cargo run --release -- scenes/reference-it-wasnt-always-empty.yaml --headphones

title: "reference: it wasn't always empty"

kind: listening

atrium: rooms/atrium_6x4.yaml

listener:
  position: [0.0, 0.0, 1.2]
  yaw_degrees: 90.0

master_gain: 1.0

distance_model:
  model: inverse
  ref_distance: 1.0
  max_distance: 40.0
  rolloff: 1.0

speakers:
  layout: '5.1'
  render_mode: vbap
  positions:
    fl: [-3.0, 2.0, 0.0]
    fr: [3.0, 2.0, 0.0]
    c: [0.0, 2.0, 0.0]
    rl: [-3.0, -2.0, 0.0]
    rr: [3.0, -2.0, 0.0]
  dbap_rolloff_db: 6.0

normalization:
  target_rms: 0.1
  spl_reference: 94.0
  spl_threshold: 0.0

sounds:
  left:
    name: "it wasn't always empty · left"
    group: References
    sound:
      preset: sources/references/it-wasnt-always-empty-left.yaml
      level: 58.0
    place: [-1.0, 1.732, 1.2]
  right:
    name: "it wasn't always empty · right"
    group: References
    sound:
      preset: sources/references/it-wasnt-always-empty-right.yaml
      level: 58.0
    place: [1.0, 1.732, 1.2]

hrtf: assets/hrtf/default.sofa

weather:
  story: held
  wind: 0.0
  rain: 0.0
  storm: 0.0
  daylight: 1.0

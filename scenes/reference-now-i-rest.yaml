# Reference: now, i rest
# spiritual brother Sci-Fi, 7:00 to 10:00 of https://www.youtube.com/watch?v=hVFaaUEIpzE
#
# C minor over a pure C2 pedal (65.41 Hz) that holds still. Above it a pad
# of the scale's notes from C3 to D#4 whose two chords take turns about
# every 16 s, so the whole pad breathes on a 32 s cycle; over that, single
# notes enter one after another in the upper mids, about 19 a minute, mostly
# climbing in steps and held a few seconds: a slow arpeggio. Wide; a few
# notes slowly detuned between the ears.
#
# The recording's two channels from where stereo speakers stand, 30 degrees
# left and right of the listener, 2 m away, in the dry space, so it sounds as
# the record does on speakers. Each ear hears both channels, as with real
# speakers, so on headphones it is narrower than the record played straight
# into the ears (width 0.15-0.25 lower; 0.34 against 0.57 for "it wasn't
# always empty"). Someone else's recording: not in git. Fetch it first:
#   sh scripts/clip.sh https://www.youtube.com/watch?v=hVFaaUEIpzE 7:00 10:00
# Taken apart in docs/ambient-recipes.md.
#   cargo run --release -- scenes/reference-now-i-rest.yaml --headphones

title: "reference: now, i rest"

kind: listening

atrium: rooms/atrium_6x4.yaml

listener:
  position: [0.0, 0.0, 1.2]
  yaw_degrees: 90.0

master_gain: 1.0

distance_model:
  model: inverse
  ref_distance: 1.0
  max_distance: 40.0
  rolloff: 1.0

speakers:
  layout: '5.1'
  render_mode: vbap
  positions:
    fl: [-3.0, 2.0, 0.0]
    fr: [3.0, 2.0, 0.0]
    c: [0.0, 2.0, 0.0]
    rl: [-3.0, -2.0, 0.0]
    rr: [3.0, -2.0, 0.0]
  dbap_rolloff_db: 6.0

normalization:
  target_rms: 0.1
  spl_reference: 94.0
  spl_threshold: 0.0

sounds:
  left:
    name: "now, i rest · left"
    group: References
    sound:
      preset: sources/references/now-i-rest-left.yaml
      level: 58.0
    place: [-1.0, 1.732, 1.2]
  right:
    name: "now, i rest · right"
    group: References
    sound:
      preset: sources/references/now-i-rest-right.yaml
      level: 58.0
    place: [1.0, 1.732, 1.2]

hrtf: assets/hrtf/default.sofa

weather:
  story: held
  wind: 0.0
  rain: 0.0
  storm: 0.0
  daylight: 1.0

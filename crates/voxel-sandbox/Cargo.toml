[package]
name = "voxel-sandbox"
version = "0.1.0"
edition = "2021"
description = "Procedural voxel diorama sandbox — prototype for the Atrium visual layer"

[dependencies]
voxel-core = { path = "../voxel-core" }
bevy = "0.18"
bevy_egui = "0.39"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

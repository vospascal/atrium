[package]
name = "voxel-color"
version = "0.1.0"
edition = "2021"
description = "Output colour path: bit depth, transfer functions and the nits convention"
# README.md is the ROADMAP, not a summary: what the finished colour path should be, what
# blocks each piece, and which counter-intuitive decisions must not be "fixed". Read it
# before changing anything in here.
readme = "README.md"

# Only wgpu and the platform colour-management API, deliberately. This crate knows
# about colour spaces, transfer functions and texture formats; it must not learn about
# voxels, materials or render passes. If it ever needs one of those, the boundary is in
# the wrong place.
[dependencies]
wgpu = "29"

# Tagging the swapchain's colour space (see `src/color_space.rs`). Apple-only because
# it is the only platform of ours that exposes the hook — `tag()` is a no-op elsewhere.
#
# VERSIONS ARE PINNED TO WHAT wgpu-hal 29 USES, and must move with it. We reach the
# `CAMetalLayer` through `Surface::as_hal`, so wgpu-hal's `CAMetalLayer` and ours have
# to be the SAME type; a version skew here is not a warning, it is a type error at the
# `setColorspace` call. `objc2-quartz-core`'s `colorspace` accessors are feature-gated
# and wgpu-hal does not ask for them, so we enable `objc2-core-graphics` ourselves and
# let Cargo's feature unification hand it to both of us.
# Windows headroom (`DxgiOutputHeadroom`). Version pinned to wgpu-hal 29's `windows` for
# the same reason as the objc2 crates: we borrow wgpu's own `IDXGISwapChain3` through
# `as_hal`, so the COM types have to be the same ones.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }

# Android/Quest headroom (`AndroidDisplayHeadroom`). The ratio lives on the Java `Display`,
# not on anything wgpu holds, so this goes through JNI. Both crates are already in the tree
# via winit; `ndk-context` is the standard way to reach the process's JavaVM and Activity.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.3"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGColorSpace",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-graphics",
] }

[package]
name = "voxel-rt"
version = "0.1.0"
edition = "2021"
description = "Ray-traced voxel renderer library — wgpu + winit input types, no egui, no Bevy"

[dependencies]
# Perf instrumentation: CPU spans, frame pacing, GPU timestamp queries. The `gpu`
# feature is what pulls in the wgpu half; the audio engine takes the same crate
# without it.
atrium-profile = { path = "../profile", features = ["gpu"] }
bytemuck = "1"
glam = "0.30"
naga = { version = "29", features = ["wgsl-in"] }
# Shader composition: the ten WGSL fragments are built as an import graph rather than
# concatenated, which is what makes a wrong-direction dependency a compile error. 0.22 is the
# release that pins naga 29, matching this tree's wgpu; 0.23 moved to naga 30 and would put two
# incompatible naga versions in one graph.
naga_oil = { version = "0.22", default-features = false }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voxel-core = { version = "0.1.0", path = "../voxel-core" }
# `naga-ir` lets a composed `naga::Module` be handed to the device directly, with no
# WGSL round-trip through naga's backend in between.
wgpu = { version = "29", features = ["naga-ir"] }
voxel-color = { path = "../voxel-color" }
voxel-environment = { path = "../voxel-environment" }
voxel-graph = { path = "../voxel-graph" }
voxel-material = { path = "../voxel-material" }
voxel-material-graph = { path = "../voxel-material-graph" }
winit = "0.30"

[dev-dependencies]
# examples/bench_dda.rs: correctness PNGs from the low-sun shadow scenario.
png = "0.18"

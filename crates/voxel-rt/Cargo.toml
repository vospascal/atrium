[package]
name = "voxel-rt"
version = "0.1.0"
edition = "2021"
description = "Standalone ray-traced voxel renderer — winit + wgpu + egui, no Bevy"

[dependencies]
bytemuck = "1"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
glam = "0.30"
naga = { version = "29", features = ["wgsl-in"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voxel-core = { version = "0.1.0", path = "../voxel-core" }
wgpu = "29"
voxel-color = { path = "../voxel-color" }
voxel-environment = { path = "../voxel-environment" }
voxel-graph = { path = "../voxel-graph" }
voxel-material = { path = "../voxel-material" }
voxel-material-graph = { path = "../voxel-material-graph" }
winit = "0.30"

[dev-dependencies]
# examples/bench_dda.rs: correctness PNGs from the low-sun shadow scenario.
png = "0.18"
# examples/naga_oil_probe.rs only — the Stage D evaluation. 0.22 is the release that
# pins naga 29, matching this tree's wgpu; 0.23 moved to naga 30 and would give us two
# incompatible naga versions in one graph. A dev-dependency until the probe's verdict
# says whether the renderer should depend on it for real.
naga_oil = { version = "0.22", default-features = false }

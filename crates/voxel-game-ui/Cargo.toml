[package]
name = "voxel-game-ui"
version = "0.1.0"
edition = "2021"
description = "Game-facing panels: the settings window and the performance readout"

# The two toggled windows the player sees, as opposed to the authoring surface in `voxel-studio`.
# Independent of it in both directions.
[dependencies]
atrium-profile = { path = "../profile", features = ["gpu"] }
egui = "0.35"
voxel-color = { path = "../voxel-color" }
voxel-environment = { path = "../voxel-environment" }
voxel-rt = { path = "../voxel-rt" }

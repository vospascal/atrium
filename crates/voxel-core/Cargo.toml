[package]
name = "voxel-core"
version = "0.1.0"
edition = "2021"
description = "Renderer-agnostic voxel data, storage, generation, and noise — no engine dependency"

[dependencies]
serde = { version = "1", features = ["derive"] }
# MagicaVoxel .vox parsing (src/vox.rs). Lives here because a .vox file is world
# data — a grid plus a palette — rather than renderer behavior.
dot_vox = "5"
serde_json = "1"

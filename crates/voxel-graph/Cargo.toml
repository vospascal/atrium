[package]
name = "voxel-graph"
version = "0.1.0"
edition = "2021"
description = "Node-graph documents: identity, wiring, validation and history — no domain knowledge"

# Deliberately serde and nothing else. This crate is the "picture" half of the node
# system: what a graph IS, not what any particular graph MEANS. A dependency on a voxel,
# a material or a shader here would make it unusable for the texture, audio and animation
# graphs it exists to serve. `cargo tree -p voxel-graph` is the test.
[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Only to prove the on-disk encoding, never to produce it.
serde_json = "1"

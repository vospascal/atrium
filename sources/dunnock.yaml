# Kind: Dunnock
# A quick, even warble from low in a hedge.
#
# A kind that rests between takes: it utters one of its takes, rests, and utters another,
# never the same one twice running. The level and the gaps are a first guess
# by ear, not measured.

name: Dunnock
group: Creatures
reference_spl: 55.0        # dB SPL at 1 m
width: 360
spread: 0.0                 # a point

takes:
  - { file: assets/birds/heggenmus/heggenmus-zang_1.mp3, name: Phrase 1 }
  - { file: assets/birds/heggenmus/heggenmus-zang_2.mp3, name: Phrase 2 }
  - { file: assets/birds/heggenmus/heggenmus-zang_3.mp3, name: Phrase 3 }
  - { file: assets/birds/heggenmus/heggenmus-zang_4.mp3, name: Phrase 4 }
  - { file: assets/birds/heggenmus/heggenmus-zang_5.mp3, name: Phrase 5 }

rule:
  rests:
    gap: [5, 12]             # seconds of rest between two phrases
    vary: { level: 2, pitch: 15 }   # each phrase up to 2 dB and 15 cents different

# Sings by day, stops as soon as it really rains, and in a storm or strong wind.
follows:
  - { condition: rain, setting: activity, from: 1, to: 0, over: [0.05, 0.35] }
  - { condition: storm, setting: activity, from: 1, to: 0, over: [0, 0.3] }
  - { condition: wind, setting: activity, from: 1, to: 0.2, over: [0.5, 0.9] }
  - { condition: daylight, setting: activity, from: 0.15, to: 1, over: [0.1, 0.6] }

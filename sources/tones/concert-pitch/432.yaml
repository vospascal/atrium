# Concert pitch: 432 Hz, “A4 (concert)”.
# A focus tone: an octave stack, see src/synth/focus_tone.rs and
# docs/focus-tones.md. The number and its label are the source's; no effect
# of any frequency is claimed.
name: 432 Hz · Verdi's A
group: Concert pitch
about: >-
  harmonance.com calls 432 Hz “A4 (concert)”, Verdi's A. Verdi argued for A
  = 432 Hz in the 1880s, but before the 440 Hz standard (1939, ISO 16 in
  1975) concert pitch varied widely from place to place, so 432 Hz was one
  historical tuning among many. It plays 432, 216 and 108 Hz: the tone and
  up to three octaves below it, none under 60 Hz, with the weight passing
  slowly from the tone down through them. Small studies report listeners
  finding it warmer without controlling the music; no effect on focus or
  health has been measured.
synth: focus_tone

pitch: 432.0              # Hz, the named pitch: the stack's top line
floor: 60.0               # Hz: up to three octaves below the pitch, none under this
rotation_period: 24.0     # s: the emphasis goes once round the lines
rotation_depth: 8.0       # dB: each line swings this much, low to high
master_gain: 1.0

# A quiet listening level: a choice, not a measurement of anything.
reference_spl: 50.0       # dB SPL at 1 m

# Solfeggio set: 369 Hz, “Tesla 3 6 9”.
# A focus tone: an octave stack, see src/synth/focus_tone.rs and
# docs/focus-tones.md. The number and its label are the source's; no effect
# of any frequency is claimed.
name: 369 Hz · Tesla 3 6 9
group: Solfeggio
about: >-
  harmonance.com calls 369 Hz “Tesla 3 6 9”. 369 Hz is not one of the
  traditional solfeggio tones: the site adds it to its solfeggio set, after
  the digits 3, 6 and 9 often attributed to Nikola Tesla. It plays 369,
  184.5 and 92.25 Hz: the tone and up to three octaves below it, none under
  60 Hz, with the weight passing slowly from the tone down through them. No
  effect on focus, sleep or health has been measured for it.
synth: focus_tone

pitch: 369.0              # Hz, the named pitch: the stack's top line
floor: 60.0               # Hz: up to three octaves below the pitch, none under this
rotation_period: 24.0     # s: the emphasis goes once round the lines
rotation_depth: 8.0       # dB: each line swings this much, low to high
master_gain: 1.0

# A quiet listening level: a choice, not a measurement of anything.
reference_spl: 50.0       # dB SPL at 1 m

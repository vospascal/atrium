# Planetary set: 141.27 Hz, “Mercury”.
# A focus tone: an octave stack, see src/synth/focus_tone.rs and
# docs/focus-tones.md. The number and its label are the source's; no effect
# of any frequency is claimed.
name: Mercury · 141.27 Hz
group: Planetary
about: >-
  harmonance.com calls 141.27 Hz “Mercury”. It is Hans Cousto's 1978 “cosmic
  octave”: Mercury's orbit, 87.97 days, as a frequency raised 30 octaves (2^30
  / period = 141.27 Hz). It plays 141.27 and 70.635 Hz: the tone and up to
  three octaves below it, none under 60 Hz, with the weight passing slowly
  from the tone down through them. In astrology Mercury rules Gemini (Air ·
  Mutable) and Virgo (Earth · Mutable). A symbolic association, not a
  forecast. The arithmetic holds; no effect on focus, sleep or health has been
  measured for it.
synth: focus_tone

pitch: 141.27             # Hz, the named pitch: the stack's top line
floor: 60.0               # Hz: up to three octaves below the pitch, none under this
rotation_period: 24.0     # s: the emphasis goes once round the lines
rotation_depth: 8.0       # dB: each line swings this much, low to high
master_gain: 1.0

# A quiet listening level: a choice, not a measurement of anything.
reference_spl: 50.0       # dB SPL at 1 m

# Planetary set: 194.18 Hz, “Earth (Om)”.
# A focus tone: an octave stack, see src/synth/focus_tone.rs and
# docs/focus-tones.md. The number and its label are the source's; no effect
# of any frequency is claimed.
name: Earth's day · 194.18 Hz
group: Planetary
about: >-
  harmonance.com labels 194.18 Hz “Earth (Om)” and its card calls it Earth's
  year; in Cousto's system it is Earth's day. It is Hans Cousto's 1978
  “cosmic octave”: Earth's day, 24 hours (86 400 s), as a frequency raised
  24 octaves (2^24 / period = 194.18 Hz). It plays 194.18 and 97.09 Hz: the
  tone and up to three octaves below it, none under 60 Hz, with the weight
  passing slowly from the tone down through them. The arithmetic holds; no
  effect on focus, sleep or health has been measured for it.
synth: focus_tone

pitch: 194.18             # Hz, the named pitch: the stack's top line
floor: 60.0               # Hz: up to three octaves below the pitch, none under this
rotation_period: 24.0     # s: the emphasis goes once round the lines
rotation_depth: 8.0       # dB: each line swings this much, low to high
master_gain: 1.0

# A quiet listening level: a choice, not a measurement of anything.
reference_spl: 50.0       # dB SPL at 1 m

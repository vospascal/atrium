# Planetary set: 126.22 Hz, “Sun”.
# A focus tone: an octave stack, see src/synth/focus_tone.rs and
# docs/focus-tones.md. The number and its label are the source's; no effect
# of any frequency is claimed.
name: The Sun · 126.22 Hz
group: Planetary
about: >-
  harmonance.com calls 126.22 Hz “Sun”. In Hans Cousto's 1978 “cosmic octave”
  the Sun's tone is not an observed period: it is a hypothetical body circling
  the Sun at its gravitational radius at nearly the speed of light, once every
  30.95 microseconds (32 312.5 Hz), lowered 8 octaves: 32 312.5 / 256 = 126.22
  Hz. It plays 126.22 and 63.11 Hz: the tone and up to three octaves below it,
  none under 60 Hz, with the weight passing slowly from the tone down through
  them. In astrology the Sun rules Leo (Fire · Fixed). A symbolic association,
  not a forecast. The arithmetic holds; no effect on focus, sleep or health
  has been measured for it.
synth: focus_tone

pitch: 126.22             # Hz, the named pitch: the stack's top line
floor: 60.0               # Hz: up to three octaves below the pitch, none under this
rotation_period: 24.0     # s: the emphasis goes once round the lines
rotation_depth: 8.0       # dB: each line swings this much, low to high
master_gain: 1.0

# A quiet listening level: a choice, not a measurement of anything.
reference_spl: 50.0       # dB SPL at 1 m

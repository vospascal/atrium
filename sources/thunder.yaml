# Synth source: thunder worked out from a lightning channel (see
# docs/thunder-research.md). Silent until the plan tells it to strike. Its takes
# are kinds of thunder: a crack close by, a clap a few kilometres off, rolling
# thunder from a cloud flash, and a distant grumble; every clap is a new flash.
name: Thunder
group: Weather
synth: thunder
reference_spl: 112.0 # dB at 1 m: a clap is among the loudest sounds in nature, heard over any wind
width: 360
spread: 0.9         # heard from the storm's direction, but wide
gap: [8, 40]        # seconds between claps at the height of a storm

# Strikes only in a storm, and more often the stronger it is.
follows:
  - { condition: storm, setting: activity, from: 0, to: 1 }

# Source: Cicadas
# A wall of cicadas up in the trees — dense, enveloping drone rather than a
# point. Wide spread so it wraps the listener like real canopy insects.

name: Cicadas
group: Creatures
takes:
  - { file: assets/cicadas.ogg, name: Drone }
  - { file: assets/cicadas2.ogg, name: Second drone }
rule:
  rests:
    gap: [2, 15]             # seconds of rest before it starts again
    vary: { level: 2, pitch: 10 }
reference_spl: 68.0        # ~65-70 dB SPL at 1m (collective drone)
width: 360                  # diffuse, from all around the canopy
spread: 0.6                 # broad MDAP spread — not a point source

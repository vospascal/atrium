# Source: Seagull
# Coastal gull calls — bright, piercing cries that carry a long way.
# Placed high and distant, so it reads as birds passing overhead.

name: Seagull
group: Creatures
takes:
  - { file: assets/seagull.ogg, name: Call }
rule:
  rests:
    gap: [25, 50]             # seconds of rest before it starts again
    vary: { level: 2, pitch: 10 }
reference_spl: 70.0        # ~70 dB SPL at 1m (loud, carrying call)
width: 360                  # calls scatter in all directions

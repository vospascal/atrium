# Noise colours: blue noise.
# A noise colour: steady noise with a named spectrum, see
# src/synth/noise_colour.rs. Heard all around, not from a point. Every
# noise colour is set to the same A-weighted level, about 50 dB(A): a quiet
# listening level, a choice. `reference_spl` is the unweighted level that
# takes for this spectrum (measured, src/config/synth/tests.rs).
name: Blue noise
group: Noise colours
about: >-
  Hiss weighted to the top. This one follows an example recording of the
  blue noise that noise apps play: its power per hertz rises about 3 dB an
  octave through the middle, a little faster from 1 to 3 kHz, has little
  below 100 Hz, and is flat above about 5 kHz. The textbook blue noise
  keeps rising 3 dB an octave all the way up. Often likened to sparkling
  water or a running faucet. It is bright, and best kept quiet, as it is
  here: it is set to the same A-weighted level as the other colours, which
  is the fair way to compare them. No effect on sleep, focus or health is
  claimed for it.
synth: noise_colour

colour: blue
master_gain: 1.0

reference_spl: 53.4       # dB SPL at 1 m, unweighted: 50 dB(A)

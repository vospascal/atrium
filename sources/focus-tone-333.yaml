# Focus tone at 333 Hz: a sustained tone with soft overtones and a slow
# shimmer that wanders. A point you place; the scene can make it ambient.
# See src/synth/focus_tone.rs.
#
# 333 Hz is only a chosen pitch, one of the so-called "solfeggio" set. No
# effect on focus, or on anything else, is claimed or has been measured: it is
# a steady, gentle tone to place in the room, and the pitch is a setting.
name: Focus tone 333 Hz
group: Tones
synth: focus_tone

# ── Tone ────────────────────────────────────────────────────────────────────
pitch: 333.0              # Hz
fundamental_level: 0.2    # the fundamental layer (pitch + shimmer partial)
overtone_level: 0.2       # the overtone layer: harmonic n at level · brightness^(n-1)
brightness: 0.35          # each harmonic 0.35 of the one below: -9.1 dB per step

# ── Shimmer ─────────────────────────────────────────────────────────────────
# A second partial a fraction of a hertz above the pitch beats against it.
# The beat rate glides between these two, a new rate every 6 to 14 s.
shimmer_rate_min: 0.1     # Hz: one swell every 10 s at the slowest
shimmer_rate_max: 0.4     # Hz: one swell every 2.5 s at the fastest
shimmer_depth: 0.3        # the swell goes between 0.7 and 1.3 of the level (-3.1 to +2.3 dB)
master_gain: 1.0

# A quiet listening level: a choice, not a measurement of anything.
reference_spl: 52.0       # dB SPL at 1 m
width: 360
spread: 0.0               # a point: it must be easy to place

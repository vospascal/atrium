# Kind: Robin
# Thin, wistful phrases, each a little different.
#
# A kind that rests between takes: it utters one of its takes, rests, and utters another,
# never the same one twice running. The gaps are a first guess by ear, not measured.
#
# The level is measured: song peaks at 83.0 ± 3.7 dB(A) at 1 m (loudest 125 ms of each
# song, Brumm et al. 2025, Proc. R. Soc. B 292: 20251088). reference_spl is the level
# while it sounds, so the peak minus how far this kind's own takes peak above
# their level while sounding (6.2 dB on average, A-weighted peak over unweighted level).

name: Robin
group: Creatures
reference_spl: 77.0        # dB SPL at 1 m, while it sounds
width: 360
spread: 0.0                 # a point

takes:
  - { file: assets/birds/roodborst/roodborst-zang_1.mp3, name: Phrase 1 }
  - { file: assets/birds/roodborst/roodborst-zang_2.mp3, name: Phrase 2 }
  - { file: assets/birds/roodborst/roodborst-zang_3.mp3, name: Phrase 3 }
  - { file: assets/birds/roodborst/roodborst-zang_4.mp3, name: Phrase 4 }
  - { file: assets/birds/roodborst/roodborst-zang_5.mp3, name: Phrase 5 }

rule:
  rests:
    gap: [4, 10]             # seconds of rest between two phrases
    vary: { pitch: 15 }       # each phrase up to 15 cents different
    # How loud, measured (Brumm et al. 2025): songs spread by SD 3.7 dB, from
    # 69.3–93.6 dB(A) at 1 m. About 70 % of that variance is one bird against
    # another and 30 % one song against the next (Deoniziak et al. 2026, Ecol.
    # Evol. 16: e74693: SD 2.07 dB between birds of a species, about 2.5 in all).
    level_spread: { individual: 3.1, utterance: 2.0, range: [-13.7, 10.6] }

# Sings by day, stops as soon as it really rains, and in a storm or strong wind.
follows:
  - { condition: rain, setting: activity, from: 1, to: 0, over: [0.05, 0.35] }
  - { condition: storm, setting: activity, from: 1, to: 0, over: [0, 0.3] }
  - { condition: wind, setting: activity, from: 1, to: 0.2, over: [0.5, 0.9] }
  - { condition: daylight, setting: activity, from: 0.15, to: 1, over: [0.1, 0.6] }

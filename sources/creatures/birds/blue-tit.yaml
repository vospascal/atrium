# Kind: Blue tit
# Short high notes and a trill, often.
#
# A kind that rests between takes: it utters one of its takes, rests, and utters another,
# never the same one twice running. The gaps are a first guess by ear, not measured.
#
# The level is measured: song peaks at 77.7 ± 2.9 dB(A) at 1 m (loudest 125 ms of each
# song, Brumm et al. 2025, Proc. R. Soc. B 292: 20251088). reference_spl is the level
# while it sounds, so the peak minus how far this kind's own takes peak above
# their level while sounding (4.1 dB on average, A-weighted peak over unweighted level).

name: Blue tit
group: Creatures
reference_spl: 74.0        # dB SPL at 1 m, while it sounds
width: 360
spread: 0.0                 # a point

takes:
  - { file: assets/birds/pimpelmees/pimpelmees-zang_1.mp3, name: Phrase 1 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_2.mp3, name: Phrase 2 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_3.mp3, name: Phrase 3 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_4.mp3, name: Phrase 4 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_5.mp3, name: Phrase 5 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_6.mp3, name: Phrase 6 }

rule:
  rests:
    gap: [2, 7]             # seconds of rest between two phrases
    vary: { pitch: 15 }       # each phrase up to 15 cents different
    # How loud, measured (Brumm et al. 2025): songs spread by SD 2.9 dB, from
    # 69.8–83.4 dB(A) at 1 m. About 70 % of that variance is one bird against
    # another and 30 % one song against the next (Deoniziak et al. 2026, Ecol.
    # Evol. 16: e74693: SD 2.07 dB between birds of a species, about 2.5 in all).
    level_spread: { individual: 2.4, utterance: 1.6, range: [-7.9, 5.7] }

# Sings by day, stops as soon as it really rains, and in a storm or strong wind.
follows:
  - { condition: rain, setting: activity, from: 1, to: 0, over: [0.05, 0.35] }
  - { condition: storm, setting: activity, from: 1, to: 0, over: [0, 0.3] }
  - { condition: wind, setting: activity, from: 1, to: 0.2, over: [0.5, 0.9] }
  - { condition: daylight, setting: activity, from: 0.15, to: 1, over: [0.1, 0.6] }

# Kind: Blue tit
# Short high notes and a trill, often.
#
# A kind that rests between takes: it utters one of its takes, rests, and utters another,
# never the same one twice running. The level and the gaps are a first guess
# by ear, not measured.

name: Blue tit
group: Creatures
reference_spl: 56.0        # dB SPL at 1 m
width: 360
spread: 0.0                 # a point

takes:
  - { file: assets/birds/pimpelmees/pimpelmees-zang_1.mp3, name: Phrase 1 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_2.mp3, name: Phrase 2 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_3.mp3, name: Phrase 3 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_4.mp3, name: Phrase 4 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_5.mp3, name: Phrase 5 }
  - { file: assets/birds/pimpelmees/pimpelmees-zang_6.mp3, name: Phrase 6 }

rule:
  rests:
    gap: [2, 7]             # seconds of rest between two phrases
    vary: { level: 2, pitch: 15 }   # each phrase up to 2 dB and 15 cents different

# Sings by day and falls silent in the rain.
follows:
  - { condition: rain, setting: activity, from: 1, to: 0 }
  - { condition: daylight, setting: activity, from: 0.15, to: 1 }

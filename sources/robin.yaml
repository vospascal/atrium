# Kind: Robin
# Thin, wistful phrases, each a little different.
#
# A kind that rests between takes: it utters one of its takes, rests, and utters another,
# never the same one twice running. The level and the gaps are a first guess
# by ear, not measured.

name: Robin
group: Creatures
reference_spl: 58.0        # dB SPL at 1 m
width: 360
spread: 0.0                 # a point

takes:
  - { file: assets/birds/roodborst/roodborst-zang_1.mp3, name: Phrase 1 }
  - { file: assets/birds/roodborst/roodborst-zang_2.mp3, name: Phrase 2 }
  - { file: assets/birds/roodborst/roodborst-zang_3.mp3, name: Phrase 3 }
  - { file: assets/birds/roodborst/roodborst-zang_4.mp3, name: Phrase 4 }
  - { file: assets/birds/roodborst/roodborst-zang_5.mp3, name: Phrase 5 }

rule:
  rests:
    gap: [4, 10]             # seconds of rest between two phrases
    vary: { level: 2, pitch: 15 }   # each phrase up to 2 dB and 15 cents different

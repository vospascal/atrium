# Bright, steady soft wind derived from the local 28.7-second research example.
#
# A diffuse Field emitter. Its high, persistent 2-16 kHz bed and fast spectral
# ruffles make it a different acoustic response from the darker field_wind.
synth: soft_wind

# Shared three-scale wind-state model. The recording's level motion is divided
# almost evenly between slow weather and frequent 0.2-1 Hz gust/ruffle motion.
min_speed: 1.0
max_speed: 5.0
change_time_min: 10.0
change_time_max: 24.0
gust_duration_min: 0.8
gust_duration_max: 4.0
turbulence_time_min: 0.05
turbulence_time_max: 0.40
gust_strength: 0.25
rise_bias: 0.10
turbulence_depth: 0.35
gust_brightness: 0.18
turbulence_brightness: 0.10

# Reference-matched spectral balance: very little low pressure, then a broad
# close-textured wash concentrated around 4-16 kHz.
low_gain: 0.02
body_gain: 0.55
mid_gain: 1.05
presence_gain: 2.25
air_gain: 0.11
master_gain: 1.0

reference_spl: 42.0
directivity: omni
spread: 1.0

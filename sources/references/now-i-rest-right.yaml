# Reference: now, i rest (spiritual brother Sci-Fi), 7:00-10:00, right channel.
# https://www.youtube.com/watch?v=hVFaaUEIpzE
# One channel of a stretch of someone else's recording, played with its
# other channel as a stereo pair (the engine's recordings are mono). The
# file is not in git; fetch it, and both channels, with:
#   sh scripts/clip.sh https://www.youtube.com/watch?v=hVFaaUEIpzE 7:00 10:00
# The level is a quiet listening level chosen for all the references alike,
# not a measurement: the seven measure 51-59 dB SPL at the listener on
# headphones (41-57 dB(A): these pieces are mostly bass).

name: "now, i rest · right"
group: References
about: >-
  now, i rest, by spiritual brother Sci-Fi, 7:00 to 10:00 of
  https://www.youtube.com/watch?v=hVFaaUEIpzE: the recording's right
  channel, played with the left one as a stereo pair in
  scenes/reference-now-i-rest.yaml. C minor over a pure C2 pedal (65.41 Hz)
  that holds still. Above it a pad of the scale's notes from C3 to D#4 whose
  two chords take turns about every 16 s, so the whole pad breathes on a 32
  s cycle; over that, single notes enter one after another in the upper
  mids, about 19 a minute, mostly climbing in steps and held a few seconds:
  a slow arpeggio. Wide; a few notes slowly detuned between the ears.
  Someone else's recording, kept as a reference to listen to and measure
  against (docs/ambient-recipes.md); it is not in the repository: sh
  scripts/clip.sh https://www.youtube.com/watch?v=hVFaaUEIpzE 7:00 10:00
takes:
  - { file: "assets/clips/channels/hVFaaUEIpzE-420-600-right.wav", name: "Right" }
rule: loops
reference_spl: 58.0        # dB SPL at 1 m, while it sounds
width: 360
spread: 0.0

name: "the starships never pass by here anymore · right"
group: References
about: >-
  the starships never pass by here anymore, by spiritual brother Sci-Fi,
  7:00 to 10:00 of https://www.youtube.com/watch?v=Bx5byPcxk5E: the
  recording's right channel, played with the left one as a stereo pair in
  scenes/reference-the-starships-never-pass-by-here-anymore.yaml. A low
  drone on A1 (55.9 Hz) and notes above it near D3, E3, E4, A4 and B4, the
  whole tuned 30 to 45 cents above concert pitch. Everything swells and
  fades together, loosely, on a cycle of about 32 s. Some notes sit clearly
  to one side (up to 8 dB louder in one ear), one is detuned 1.2 Hz between
  the ears; no events, no pulse. Someone else's recording, kept as a
  reference to listen to and measure against (docs/ambient-recipes.md); it
  is not in the repository: sh scripts/clip.sh
  https://www.youtube.com/watch?v=Bx5byPcxk5E 7:00 10:00
takes:
  - { file: "assets/clips/channels/Bx5byPcxk5E-420-600-right.wav", name: "Right" }

[workspace]
members = [
    ".",
    "crates/analysis",
    "crates/core",
    "crates/ffi",
    "crates/recipe",
    "crates/tui",
    "crates/world",
]

[package]
name = "atrium"
version = "0.1.0"
edition = "2021"
description = "Spatial audio engine with acoustic zone simulation"
default-run = "atrium"

[dependencies]
atrium-analysis = { path = "crates/analysis" }
atrium-core = { path = "crates/core" }
atrium-recipe = { path = "crates/recipe" }
atrium-world = { path = "crates/world" }
cpal = "0.15"
rtrb = "0.3"
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: `analyse --compare` reads reports back from their JSON, and
# they must compare exactly as the reports they were written from.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"

# Symphonia: only enable the codecs/formats we need
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm", "aac", "ogg", "vorbis"] }
sofar = "0.2.1"
realfft = "3.5"
atrium-tui = { path = "crates/tui", optional = true }

# Profiling (optional, zero-cost when disabled)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tracing-perfetto = { version = "0.1", optional = true }
tracing-flame = { version = "0.2", optional = true }

[features]
default = ["tui"]
tui = ["dep:atrium-tui"]
profiler = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-perfetto", "dep:tracing-flame"]
memprof = []

# Optimize deps in debug mode (DSP crates like realfft are unusably slow unoptimized)
[profile.dev.package."*"]
opt-level = 3

# The engine's own audio code too. The desktop app builds the engine with the
# dev profile (its binding plugin has no release switch), and unoptimized it
# could not keep up: a 512-frame callback at 44.1 kHz has 11.6 ms, and the
# meadow on headphones took 10.8 ms at the median and 12.5 ms at the 99th
# percentile, heard as the sound cutting up. Optimized it takes 0.6 ms.
# Debug assertions and overflow checks stay on. The price is a slower rebuild
# of these two crates after a change.
[profile.dev.package.atrium]
opt-level = 3

[profile.dev.package.atrium-core]
opt-level = 3

# The analyser's tests measure minutes of noise; unoptimized they take minutes.
[profile.dev.package.atrium-analysis]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false
